# 本地开发基础设施。应用本身直接 python 起，不放 compose 里，reload 快。
# 用法：
#   docker compose up -d    # 起 Postgres + Redis
#   docker compose down     # 停
#   docker compose down -v  # 停并清数据（慎用）

services:
  postgres:
    image: postgres:15-alpine
    container_name: tts-postgres
    environment:
      POSTGRES_DB: tts
      POSTGRES_USER: tts
      POSTGRES_PASSWORD: tts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tts"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tts-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
